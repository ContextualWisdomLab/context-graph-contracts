[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "cwl-context-contracts"
version = "0.1.0"
description = "Shared identifiers, temporal semantics, provenance, and event contracts for the CWL Context Fabric"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "ContextualWisdomLab"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.scripts]
cwl-context-conformance = "cwl_context_contracts.conformance_runner:main"

[project.optional-dependencies]
dev = [
  "coverage==7.15.2",
  "jsonschema==4.26.0",
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[tool.uv]
required-version = "==0.11.32"

[tool.hatch.build.targets.wheel]
packages = ["src/cwl_context_contracts"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cwl_context_contracts"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
