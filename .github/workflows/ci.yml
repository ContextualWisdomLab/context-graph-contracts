name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: false
      - run: uv sync --extra dev --python "${{ matrix.python-version }}"
      - run: uv run --extra dev --python "${{ matrix.python-version }}" python -m compileall -q src
      - run: uv run --extra dev --python "${{ matrix.python-version }}" python -m ruff check .
      - run: uv run --extra dev --python "${{ matrix.python-version }}" python -m coverage run -m pytest -q
      - run: uv run --extra dev --python "${{ matrix.python-version }}" python -m coverage report

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: false
      - run: uv sync --extra dev --python 3.13
      - run: uv build --wheel --sdist --out-dir dist
      - run: uv venv .package-smoke --python 3.13
      - run: uv pip install --python .package-smoke/bin/python --no-index --find-links dist cwl-context-contracts
      - run: .package-smoke/bin/python -c "from cwl_context_contracts import TruthStatus; assert TruthStatus.OBSERVED.value == 'observed'"
