name: receipt-package-smoke

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: false
      - run: uv lock --check
      - run: uv sync --frozen --extra dev --python 3.14
      - run: uv build --wheel --out-dir dist
      - run: uv venv .receipt-smoke --python 3.14
      - run: >-
          uv pip install --python .receipt-smoke/bin/python
          --no-index --find-links dist cwl-context-contracts
      - name: Exercise release evidence from installed wheel
        run: |
          set -euo pipefail
          .receipt-smoke/bin/cwl-context-conformance-manifest \
            > /tmp/approved-manifest.json
          .receipt-smoke/bin/cwl-context-conformance-receipt \
            /tmp/approved-manifest.json > /tmp/admission-receipt.json
          .receipt-smoke/bin/cwl-context-bundle-manifest \
            > /tmp/contract-bundle-manifest.json
          .receipt-smoke/bin/cwl-context-bundle-verify \
            /tmp/contract-bundle-manifest.json \
            > /tmp/contract-bundle-verification.json
          .receipt-smoke/bin/cwl-context-release-admit \
            /tmp/approved-manifest.json \
            /tmp/contract-bundle-manifest.json \
            > /tmp/contract-release-admission.json
          .receipt-smoke/bin/python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(
              Path("/tmp/admission-receipt.json").read_text(encoding="utf-8")
          )
          bundle_manifest = json.loads(
              Path("/tmp/contract-bundle-manifest.json").read_text(encoding="utf-8")
          )
          bundle_verification = json.loads(
              Path("/tmp/contract-bundle-verification.json").read_text(
                  encoding="utf-8"
              )
          )
          release_admission = json.loads(
              Path("/tmp/contract-release-admission.json").read_text(
                  encoding="utf-8"
              )
          )
          assert receipt["receipt_format"] == (
              "cwl-context-conformance-admission-receipt/v1"
          )
          assert receipt["canonicalization"] == "RFC8785"
          assert receipt["manifest_normalization"] == "profile_name_ascending"
          assert receipt["digest_algorithm"] == "sha256"
          assert receipt["admitted"] is True
          assert receipt["installed_distribution_name"] == "cwl-context-contracts"
          assert len(receipt["approved_manifest_canonical_sha256"]) == 64
          assert len(receipt["admission_evidence_sha256"]) == 64
          assert receipt["next_action"] == (
              "verify artifact provenance and runtime authorization before enabling "
              "the integration"
          )
          assert bundle_manifest["manifest_format"] == (
              "cwl-context-bundle-manifest/v1"
          )
          assert bundle_manifest["distribution_name"] == "cwl-context-contracts"
          assert bundle_manifest["algorithm"] == "sha256"
          assert bundle_manifest["resource_count"] == len(bundle_manifest["resources"])
          resource_paths = {
              item["resource_path"] for item in bundle_manifest["resources"]
          }
          assert {
              "schemas/data-management-framework.schema.json",
              "schemas/data-management-assessment.schema.json",
              "fixtures/data-management-contract.valid.json",
              "fixtures/data-management-assessment.valid.json",
              "conformance/data-management-assessment-semantics.v1.json",
          } <= resource_paths
          assert bundle_manifest["resources"] == sorted(
              bundle_manifest["resources"],
              key=lambda item: item["resource_path"],
          )
          assert all(len(item["sha256"]) == 64 for item in bundle_manifest["resources"])
          assert bundle_manifest["next_action"] == (
              "store this manifest with approved release evidence and verify semantic "
              "conformance, package provenance, and runtime authorization before "
              "enabling the integration"
          )
          assert bundle_verification == {
              "verification_format": "cwl-context-bundle-verification/v1",
              "verified": True,
              "installed_distribution_name": "cwl-context-contracts",
              "installed_distribution_version": bundle_manifest[
                  "distribution_version"
              ],
              "mismatches": [],
              "next_action": "accept the installed contract bundle evidence",
          }
          assert release_admission["admission_format"] == (
              "cwl-context-contract-release-admission/v1"
          )
          assert release_admission["admitted"] is True
          assert release_admission["conformance_admission"]["admitted"] is True
          assert release_admission["bundle_verification"]["verified"] is True
          assert release_admission["next_action"] == (
              "verify artifact provenance, protected-release evidence, and runtime "
              "authorization before enabling the integration"
          )
          PY